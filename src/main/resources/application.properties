spring.application.name=sheprenure
server.forward-headers-strategy=framework

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Brevo Email API (HTTPS — primary mail provider) ─────────
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:SHEPRENURE}

# ── Spring Mail (disabled — all email goes through Brevo API) ─
# These properties must exist to prevent Spring Boot auto-config
# from failing at startup when Gmail SMTP vars are not set.
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:noreply@example.com}
spring.mail.password=${GMAIL_APP_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Disable Spring Mail auto-configuration if GMAIL_USERNAME is not set
# (comment this out only if you switch back to SMTP-based email)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

# ── Cloudinary ────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Frontend URL & OAuth2 ─────────────────────────────────────
frontend.url=${FRONTEND_URL:http://localhost:5173}
